version: '3.9'


services:
  anderson:
  image: ghcr.io/andernarvaez05/flask-app:1.0.1
  networks:
       - traefik-public
deploy: 
   replicas: 1
   update_config:
   parallelism: 1
   delay: 10s
   restart_policy:
   condition: on-failure

labels:
        - "traefik.enable=true"
        - "traefik.http.routers.anderson.entrypoints=http"
        - "traefik.http.routers.anderson.rule=Host(anderson.byronrm.com)"
        - "traefik.http.middlewares.anderson-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.anderson.middlewares=anderson-https-redirect"
        - "traefik.http.routers.anderson-secure.entrypoints=https"
        - "traefik.http.routers.anderson-secure.rule=Host(anderson.byronrm.com)"
        - "traefik.http.routers.anderson-secure.tls=true"
        - "traefik.http.routers.anderson-secure.tls.certresolver=http"
        - "traefik.http.routers.anderson-secure.service=anderson"
        - "traefik.http.services.anderson.loadbalancer.server.port=5000"
        - "traefik.docker.network=traefik-public"

networks:
        traefik-public:
          external: true